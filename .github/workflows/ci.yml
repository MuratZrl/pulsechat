name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-api:
    name: API Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Must precede setup-node so `cache: pnpm` can resolve the store path.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/api/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/api
        run: pnpm install --frozen-lockfile

      # pnpm 10 skips postinstall scripts, so this step is required.
      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm exec prisma generate

      - name: Run unit tests
        working-directory: apps/api
        run: pnpm test

      - name: Run e2e tests
        working-directory: apps/api
        run: pnpm run test:e2e

      - name: Build
        working-directory: apps/api
        run: pnpm run build

  build-web:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: apps/web
        run: pnpm run build
